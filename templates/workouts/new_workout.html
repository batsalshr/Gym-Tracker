{% extends 'base.html' %}

{% block title %}New Workout - GymTracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">New Workout</h1>
    <p class="page-subtitle">Step 1: What are you training today?</p>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Select Workout Type</label>
            <div class="select-grid">
                {% for value, label in day_types %}
                <label class="select-card">
                    <input type="radio" name="day_type" value="{{ value }}" required>
                    <div class="select-card-content">
                        <span class="select-card-icon">
                            {% if value == 'chest' %}🏋️
                            {% elif value == 'back' %}🔙
                            {% elif value == 'shoulders' %}💪
                            {% elif value == 'legs' %}🦵
                            {% elif value == 'biceps' %}💪
                            {% elif value == 'triceps' %}💪
                            {% elif value == 'push' %}⬆️
                            {% elif value == 'pull' %}⬇️
                            {% elif value == 'upper' %}👆
                            {% elif value == 'lower' %}👇
                            {% elif value == 'full' %}🔄
                            {% else %}💪
                            {% endif %}
                        </span>
                        <span class="select-card-label">{{ label }}</span>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; margin-top: 2rem;">
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" value="{{ today }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Notes (optional)</label>
                <input type="text" name="notes" class="form-control" placeholder="How are you feeling today?">
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary btn-lg">
                Continue → Add Exercises
            </button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary btn-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
